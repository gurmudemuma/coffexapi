
name: coffex-network
version: 1.0.0

client:
  organization: NationalBank
  connection:
    timeout:
      peer:
        endorser: '300'

organizations:
  NationalBank:
    mspid: NationalBankMSP
    peers:
      - peer0.nationalbank.com
    certificateAuthorities:
      - ca.nationalbank.com
  ExporterBank:
    mspid: ExporterBankMSP
    peers:
      - peer0.exporterbank.com
    certificateAuthorities:
      - ca.exporterbank.com
  CoffeeAuthority:
    mspid: CoffeeAuthorityMSP
    peers:
      - peer0.coffeeauthority.com
    certificateAuthorities:
      - ca.coffeeauthority.com
  Customs:
    mspid: CustomsMSP
    peers:
      - peer0.customs.com
    certificateAuthorities:
      - ca.customs.com

orderers:
  orderer.coffee-consortium.com:
    url: grpcs://orderer.coffee-consortium.com:7050
    grpcOptions:
      ssl-target-name-override: orderer.coffee-consortium.com
      keep-alive-time: 0s
      keep-alive-timeout: 20s
      keep-alive-permit: false
      fail-fast: false
    tlsCACerts:
      path: /network/organizations/ordererOrganizations/coffee-consortium.com/orderers/orderer.coffee-consortium.com/tls/ca.crt

peers:
  peer0.nationalbank.com:
    url: grpcs://peer0.nationalbank.com:7051
    tlsCACerts:
      path: /network/organizations/peerOrganizations/nationalbank.com/tlsca/tlsca.nationalbank.com-cert.pem
  peer0.exporterbank.com:
    url: grpcs://peer0.exporterbank.com:8051
    tlsCACerts:
      path: /network/organizations/peerOrganizations/exporterbank.com/tlsca/tlsca.exporterbank.com-cert.pem
  peer0.coffeeauthority.com:
    url: grpcs://peer0.coffeeauthority.com:9051
    tlsCACerts:
      path: /network/organizations/peerOrganizations/coffeeauthority.com/tlsca/tlsca.coffeeauthority.com-cert.pem
  peer0.customs.com:
    url: grpcs://peer0.customs.com:10051
    tlsCACerts:
      path: /network/organizations/peerOrganizations/customs.com/tlsca/tlsca.customs.com-cert.pem

certificateAuthorities:
  ca.nationalbank.com:
    url: http://ca.nationalbank.com:7054
    caName: ca-nationalbank
    tlsCACerts:
      path: /network/organizations/peerOrganizations/nationalbank.com/ca/ca.nationalbank.com-cert.pem
  ca.exporterbank.com:
    url: http://ca.exporterbank.com:8054
    caName: ca-exporterbank
    tlsCACerts:
      path: /network/organizations/peerOrganizations/exporterbank.com/ca/ca.exporterbank.com-cert.pem
  ca.coffeeauthority.com:
    url: http://ca.coffeeauthority.com:9054
    caName: ca-coffeeauthority
    tlsCACerts:
      path: /network/organizations/peerOrganizations/coffeeauthority.com/ca/ca.coffeeauthority.com-cert.pem
  ca.customs.com:
    url: http://ca.customs.com:10054
    caName: ca-customs
    tlsCACerts:
      path: /network/organizations/peerOrganizations/customs.com/ca/ca.customs.com-cert.pem
